# Cloudflare Workers config for ONE HUB: a static SPA served as Workers static assets
# (no Worker script). Workers Builds runs `npm run build`, then `npx wrangler deploy`.
name = "one-hub"
compatibility_date = "2026-10-01"

[assets]
directory = "./dist"
# Unknown paths (client-side routes such as /directors/studio or /f/<form>) serve index.html.
not_found_handling = "single-page-application"

# With CONVEX_DEPLOY_KEY set this always (re)builds dist connected to Convex, and
# the production branch also deploys the Convex functions; previews only point at that deployment.
[build]
command = "bash scripts/cf-build.sh"

# Required by `wrangler preview`, which Workers Builds runs for non-production branches (PR previews).
[previews]
